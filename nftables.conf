#!/usr/sbin/nft -f
#
# /etc/nftables.conf
#
# Apply:   sudo nft -c -f /etc/nftables.conf && sudo systemctl reload nftables
# Enable:  sudo systemctl enable --now nftables
# Inspect: sudo nft list ruleset
#
# The afd4/afd6 sets are populated at runtime by /usr/local/sbin/update-afd-set.
# They are EMPTY after every load of this file, so 80/443 stay closed until that
# script runs. That is deliberate: fail closed, not open.

flush ruleset

table inet filter {

    # Azure Front Door egress ranges (service tag AzureFrontDoor.Backend).
    # 'interval' allows CIDR ranges; 'auto-merge' collapses overlaps.
    set afd4 { type ipv4_addr; flags interval; auto-merge; }
    set afd6 { type ipv6_addr; flags interval; auto-merge; }

    chain input {
        type filter hook input priority filter; policy drop;

        # Keep existing flows alive. Without this, applying the ruleset kills
        # the SSH session you are typing into.
        ct state established,related accept
        ct state invalid drop

        iif "lo" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Management access. Narrow this to your own ranges once you can.
        tcp dport 22 accept

        # Azure platform probes / wireserver (NOT in the service tag JSON).
        ip saddr 168.63.129.16 accept

        # -------------------------------------------------------------------
        # Web traffic, restricted to Front Door.
        #
        # While bringing the host up, comment these two lines out and use the
        # blanket rule below instead. Swap to the sets only once the site is
        # confirmed working, so you are changing one variable at a time.
        # -------------------------------------------------------------------
        ip  saddr @afd4 tcp dport { 80, 443 } accept
        ip6 saddr @afd6 tcp dport { 80, 443 } accept

        # Bring-up / troubleshooting only -- open to the whole internet:
        # tcp dport { 80, 443 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
